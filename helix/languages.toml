# ==============================================================================
# Helix 语言与 LSP 配置 (~/.config/helix/languages.toml)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 定义语言服务器 (Language Servers)
# ------------------------------------------------------------------------------

# Python: 采用与 Neovim / Emacs 一致的 basedpyright
[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

[language-server.basedpyright.config.basedpyright.analysis]
autoSearchPaths = true
useLibraryCodeForTypes = true
diagnosticMode = "openFilesOnly"
typeCheckingMode = "basic"

# Python: Ruff 诊断与快速 Linting
[language-server.ruff]
command = "ruff"
args = ["server"]

# ------------------------------------------------------------------------------
# 2. 语言绑定与代码格式化规则
# ------------------------------------------------------------------------------

# Python: 4 空格缩进，Ruff 格式化，双 LSP 协同 (Basedpyright + Ruff)
[[language]]
name = "python"
scope = "source.python"
injection-regex = "python"
file-types = ["py", "pyi"]
roots = ["pyproject.toml", "setup.py", "poetry.lock", ".venv", "venv", ".git"]
language-servers = ["basedpyright", "ruff"]
auto-format = true
formatter = { command = "ruff", args = ["format", "-"] }
indent = { tab-width = 4, unit = "    " }

# C / C++: 4 格缩进，使用 clangd
[[language]]
name = "c"
language-servers = ["clangd"]
indent = { tab-width = 4, unit = "    " }
auto-format = true

[[language]]
name = "cpp"
language-servers = ["clangd"]
indent = { tab-width = 4, unit = "    " }
auto-format = true

# LaTeX: 使用 TexLab 支撑，配合 4 格缩进
[[language]]
name = "latex"
language-servers = ["texlab"]
indent = { tab-width = 4, unit = "    " }

# Go: gopls 标配
[[language]]
name = "go"
language-servers = ["gopls"]
auto-format = true
formatter = { command = "gofmt" }

# Lua: luals
[[language]]
name = "lua"
language-servers = ["lua-language-server"]
indent = { tab-width = 2, unit = "  " }

# Bash / Shell:
[[language]]
name = "bash"
language-servers = ["bash-language-server"]
indent = { tab-width = 4, unit = "    " }
